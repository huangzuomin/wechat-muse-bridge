[project]
name = "wechat-muse-bridge"
version = "0.2.0"
description = "Tencent iLink transport bridge to Muse Gadget"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "qrcode>=7.4,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wechat-muse-bridge = "wechat_muse_bridge.main:main"
wechat-muse-send = "wechat_muse_bridge.send:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_muse_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
