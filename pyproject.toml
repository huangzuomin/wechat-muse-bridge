[project]
name = "wechat-muse-bridge"
version = "0.1.0"
description = "Tencent iLink transport bridge to Muse Gadget"
readme = "README.md"
license = "MIT"
authors = [{ name = "Muse Display MCP contributors" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27,<1",
    "qrcode>=7.4,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wechat-muse-bridge = "wechat_muse_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_muse_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
